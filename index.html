<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hype App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8'
            },
            dark: {
              bg: '#0f172a', card: '#1e293b', border: '#334155', text: '#f8fafc', muted: '#94a3b8'
            }
          }
        }
      }
    }
  </script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Ocultar barra de desplazamiento manteniendo funcionalidad scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 selection:bg-blue-500 selection:text-white antialiased">

  <!-- ENCABEZADO / NAVBAR TOP -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-black bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">HYPE</span>
        <span class="text-[10px] bg-blue-500/10 text-blue-400 font-bold px-2 py-0.5 rounded-full border border-blue-500/20">PRO</span>
      </div>
      <div class="flex items-center gap-3">
        <button id="authBtn" onclick="handleAuthAction()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded-lg transition">
          Iniciar Sesión
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="max-w-2xl mx-auto p-4 space-y-6">

    <!-- 1. SECCIÓN DE ESTADOS / HISTORIAS (24H) -->
    <section class="border-b border-slate-800 pb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Estados / Historias</h2>
        <span class="text-[10px] text-slate-500">Efímero 24h</span>
      </div>
      <div id="storiesContainer" class="flex gap-4 overflow-x-auto no-scrollbar pb-1">
        <!-- Tarjeta para crear Historia -->
        <div class="flex-shrink-0 text-center cursor-pointer group" onclick="triggerStoryUpload()">
          <div class="w-14 h-14 rounded-full bg-slate-800 border-2 border-dashed border-slate-600 group-hover:border-blue-500 flex items-center justify-center text-xl transition">
            ⚡
          </div>
          <span class="text-xs text-slate-400 mt-1 block group-hover:text-slate-200">Tu estado</span>
          <input type="file" id="storyFileInput" accept="image/*,video/*" class="hidden" onchange="uploadStory(this.files[0])">
        </div>
        <!-- Historias dinámicas -->
      </div>
    </section>

    <!-- 2. NAVEGACIÓN POR PESTAÑAS (TABS) -->
    <div class="flex border-b border-slate-800 text-sm font-semibold">
      <button id="tabFeedBtn" onclick="switchTab('feed')" class="flex-1 pb-3 text-center border-b-2 border-blue-500 text-blue-500 transition">
        🚀 Feed Global
      </button>
      <button id="tabHubsBtn" onclick="switchTab('hubs')" class="flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
        🌐 Hubs & Comunidades
      </button>
    </div>

    <!-- CONTENIDO PESTAÑA 1: FEED & CREACIÓN -->
    <div id="tabContentFeed" class="space-y-6">
      
      <!-- FORMULARIO DE CREACIÓN DE PUBLICACIÓN -->
      <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700/60 shadow-lg">
        <form id="postForm" class="space-y-3">
          <textarea id="postInput" rows="3" placeholder="¿Qué proyecto o idea estás construyendo hoy?" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
          
          <div id="imagePreviewContainer" class="hidden relative">
            <img id="imagePreview" src="" class="max-h-48 rounded-lg object-cover border border-slate-700">
            <button type="button" onclick="clearImageSelection()" class="absolute top-2 right-2 bg-slate-900/80 text-white p-1 rounded-full text-xs">✕</button>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-700/50">
            <label class="cursor-pointer flex items-center gap-2 text-xs text-slate-400 hover:text-slate-200 transition">
              🖼️ <span>Adjuntar Imagen</span>
              <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImagePreview(this)">
            </label>

            <button type="submit" id="btnPublish" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-2 rounded-lg transition flex items-center gap-2">
              <span>Publicar</span>
            </button>
          </div>
        </form>
      </div>

      <!-- ALIMENTACIÓN DE CONTENIDO / FEED DE POSTS -->
      <div id="feedContainer" class="space-y-4">
        <!-- Carga de Posts dinámicos -->
      </div>
    </div>

    <!-- CONTENIDO PESTAÑA 2: HUBS & COMUNIDADES -->
    <div id="tabContentHubs" class="hidden space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <h3 class="font-bold text-blue-400">🔥 Proyectos & Startups</h3>
          <p class="text-xs text-slate-400 mt-1">Comparte avances, demos y recibe retroalimentación.</p>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
          <h3 class="font-bold text-indigo-400">⚙️ Tech & Hardware Repair</h3>
          <p class="text-xs text-slate-400 mt-1">Discusión técnica, diagramas y prototipado.</p>
        </div>
      </div>
    </div>

  </main>

  <!-- BARRA DE NAVEGACIÓN INFERIOR (MOBILE BOTTOM NAV) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur-lg z-50">
    <div class="max-w-2xl mx-auto flex justify-around py-2">
      <button onclick="switchTab('feed')" class="flex flex-col items-center gap-1 text-blue-500">
        <span class="text-lg">🏠</span>
        <span class="text-[10px] font-medium">Inicio</span>
      </button>
      <button onclick="switchTab('hubs')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <span class="text-lg">🔍</span>
        <span class="text-[10px] font-medium">Hubs</span>
      </button>
      <button onclick="scrollToTop()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <span class="text-lg">⬆️</span>
        <span class="text-[10px] font-medium">Subir</span>
      </button>
    </div>
  </nav>

  <!-- JAVASCRIPT & SUPABASE LOGIC -->
  <script>
    // Inicialización del cliente Supabase
    const SUPABASE_URL = window.SUPABASE_URL || 'https://tu-proyecto.supabase.co';
    const SUPABASE_KEY = window.SUPABASE_KEY || 'tu-anon-key';
    const supabase = window.supabaseClient || supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await checkUserSession();
      await loadStories();
      await loadFeed();
      subscribeRealtimeEvents();

      document.getElementById('postForm').addEventListener('submit', handlePostSubmit);
    });

    async function checkUserSession() {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
          currentUser = user;
          document.getElementById('authBtn').innerText = 'Perfil';
        }
      } catch (e) {
        console.log("Modo visitante activo.");
      }
    }

    function switchTab(tab) {
      const feedTab = document.getElementById('tabContentFeed');
      const hubsTab = document.getElementById('tabContentHubs');
      const feedBtn = document.getElementById('tabFeedBtn');
      const hubsBtn = document.getElementById('tabHubsBtn');

      if (tab === 'feed') {
        feedTab.classList.remove('hidden');
        hubsTab.classList.add('hidden');
        feedBtn.className = "flex-1 pb-3 text-center border-b-2 border-blue-500 text-blue-500 transition";
        hubsBtn.className = "flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
      } else {
        feedTab.classList.add('hidden');
        hubsTab.classList.remove('hidden');
        hubsBtn.className = "flex-1 pb-3 text-center border-b-2 border-blue-500 text-blue-500 transition";
        feedBtn.className = "flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
      }
    }

    // GESTIÓN DE HISTORIAS
    function triggerStoryUpload() {
      document.getElementById('storyFileInput').click();
    }

    async function loadStories() {
      const container = document.getElementById('storiesContainer');
      const { data: stories } = await supabase
        .from('stories')
        .select('*, profiles(username, avatar_url)')
        .gte('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false });

      let baseHTML = `
        <div class="flex-shrink-0 text-center cursor-pointer group" onclick="triggerStoryUpload()">
          <div class="w-14 h-14 rounded-full bg-slate-800 border-2 border-dashed border-slate-600 group-hover:border-blue-500 flex items-center justify-center text-xl transition">
            ⚡
          </div>
          <span class="text-xs text-slate-400 mt-1 block group-hover:text-slate-200">Tu estado</span>
          <input type="file" id="storyFileInput" accept="image/*,video/*" class="hidden" onchange="uploadStory(this.files[0])">
        </div>
      `;

      if (stories && stories.length > 0) {
        stories.forEach(s => {
          baseHTML += `
            <div class="flex-shrink-0 text-center cursor-pointer">
              <div class="w-14 h-14 rounded-full p-[2px] bg-gradient-to-tr from-amber-500 via-rose-500 to-indigo-600">
                <img src="${s.profiles?.avatar_url || 'https://via.placeholder.com/150'}" class="w-full h-full rounded-full object-cover border-2 border-slate-900">
              </div>
              <span class="text-xs text-slate-400 mt-1 block max-w-[60px] truncate">${s.profiles?.username || 'Usuario'}</span>
            </div>
          `;
        });
      }
      container.innerHTML = baseHTML;
    }

    async function uploadStory(file) {
      if (!file) return;
      if (!currentUser) return alert("Inicia sesión para agregar un estado.");

      const filePath = `${currentUser.id}/${Date.now()}.${file.name.split('.').pop()}`;
      const { error } = await supabase.storage.from('stories').upload(filePath, file);
      if (error) return alert("Error al subir el archivo.");

      const { data } = supabase.storage.from('stories').getPublicUrl(filePath);
      await supabase.from('stories').insert([{
        user_id: currentUser.id,
        media_url: data.publicUrl,
        type: file.type.includes('video') ? 'video' : 'image'
      }]);

      loadStories();
    }

    // GESTIÓN DE PUBLICACIONES (FEED)
    function handleImagePreview(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('imagePreview').src = e.target.result;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function clearImageSelection() {
      document.getElementById('imageInput').value = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
    }

    async function loadFeed() {
      const container = document.getElementById('feedContainer');
      const { data: posts } = await supabase
        .from('posts')
        .select('*, profiles(username, avatar_url, handle), post_likes(user_id)')
        .order('created_at', { ascending: false });

      if (!posts || posts.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">No hay publicaciones todavía. ¡Sé el primero en compartir algo!</div>`;
        return;
      }

      container.innerHTML = posts.map(post => {
        const isLiked = currentUser ? post.post_likes?.some(l => l.user_id === currentUser.id) : false;
        const likesCount = post.post_likes?.length || 0;

        return `
          <article class="bg-slate-800/80 rounded-xl p-4 border border-slate-700/60 shadow-md">
            <div class="flex items-center gap-3 mb-3">
              <img src="${post.profiles?.avatar_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover border border-slate-700">
              <div>
                <div class="flex items-center gap-2">
                  <h4 class="text-sm font-semibold text-slate-100">${post.profiles?.username || 'Usuario'}</h4>
                  ${post.is_news ? '<span class="text-[10px] bg-blue-600 text-white font-bold px-1.5 py-0.5 rounded">📰 NOTICIA</span>' : ''}
                </div>
                <span class="text-xs text-slate-500">@${post.profiles?.handle || 'usuario'}</span>
              </div>
            </div>

            ${post.content ? `<p class="text-sm text-slate-200 mb-3 whitespace-pre-line">${post.content}</p>` : ''}
            ${post.image_url ? `<img src="${post.image_url}" class="w-full rounded-lg mb-3 border border-slate-700/80 max-h-96 object-cover">` : ''}

            <div class="flex items-center gap-4 pt-2 border-t border-slate-700/50">
              <button onclick="toggleLike('${post.id}', ${isLiked})" class="flex items-center gap-1.5 text-xs font-semibold ${isLiked ? 'text-red-500' : 'text-slate-400 hover:text-slate-200'} transition">
                <span>${isLiked ? '❤️' : '🤍'}</span>
                <span>${likesCount}</span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    async function handlePostSubmit(e) {
      e.preventDefault();
      if (!currentUser) return alert("Inicia sesión para publicar.");

      const input = document.getElementById('postInput');
      const fileInput = document.getElementById('imageInput');
      const content = input.value.trim();
      const file = fileInput.files[0];

      if (!content && !file) return;

      let imageUrl = null;
      if (file) {
        const filePath = `${currentUser.id}/${Date.now()}.${file.name.split('.').pop()}`;
        await supabase.storage.from('posts').upload(filePath, file);
        const { data } = supabase.storage.from('posts').getPublicUrl(filePath);
        imageUrl = data.publicUrl;
      }

      await supabase.from('posts').insert([{
        user_id: currentUser.id,
        content: content || null,
        image_url: imageUrl
      }]);

      input.value = '';
      clearImageSelection();
      loadFeed();
    }

    async function toggleLike(postId, isLiked) {
      if (!currentUser) return alert("Inicia sesión para dar Me Gusta.");
      if (isLiked) {
        await supabase.from('post_likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
      } else {
        await supabase.from('post_likes').insert([{ post_id: postId, user_id: currentUser.id }]);
      }
      loadFeed();
    }

    function subscribeRealtimeEvents() {
      supabase
        .channel('realtime_app')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadFeed())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'stories' }, () => loadStories())
        .subscribe();
    }

    function handleAuthAction() {
      alert("Redirigiendo al sistema de inicio de sesión de Supabase Auth...");
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
