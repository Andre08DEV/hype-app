<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="description" content="Hype — la red social para crear, compartir y darle hype a lo que importa: posts con Markdown, hilos, shorts, proyectos, grupos, juegos y Hype IA.">
  <title>Hype</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica tema y acento antes de pintar para evitar parpadeos.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('hype:settings') || '{}');
        var root = document.documentElement;
        var theme = s.theme || 'dark';
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        root.dataset.theme = theme;
        if (s.accentColors && s.accentColors.length === 2) {
          root.style.setProperty('--accent', s.accentColors[0]);
          root.style.setProperty('--accent-2', s.accentColors[1]);
        }
        if (s.fontScale) root.style.setProperty('--font-scale', s.fontScale);
      } catch (e) { /* sin ajustes guardados */ }
    })();
  </script>
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="boot" role="status" aria-live="polite">
      <img src="assets/icon.svg" alt="" width="64" height="64" class="boot-logo">
      <p class="boot-text">Cargando Hype…</p>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>
    <p style="padding:24px;font-family:system-ui">Hype necesita JavaScript para funcionar.</p>
  </noscript>
</body>
</html>
