<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hype App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div class="max-w-2xl mx-auto p-4 space-y-6">

    <!-- SECCIÓN DE ESTADOS / HISTORIAS -->
    <div class="border-b border-slate-700/60 pb-4">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">HISTORIAS</h2>
      <div id="storiesContainer" class="flex gap-4 overflow-x-auto pb-2 scrollbar-none">
        <!-- Botón para agregar historia -->
        <div class="flex-shrink-0 text-center cursor-pointer" onclick="document.getElementById('storyFileInput').click()">
          <div class="w-14 h-14 rounded-full bg-slate-800 border-2 border-dashed border-slate-600 flex items-center justify-center text-xl hover:border-blue-500 transition">
            ➕
          </div>
          <span class="text-xs text-slate-400 mt-1 block">Tu estado</span>
          <input type="file" id="storyFileInput" accept="image/*,video/*" class="hidden" onchange="uploadStory(this.files[0])">
        </div>
      </div>
    </div>

    <!-- SECCIÓN DE CREAR PUBLICACIÓN -->
    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/60 shadow-lg">
      <form id="postForm" class="space-y-3">
        <textarea id="postInput" rows="3" placeholder="¿Qué está pasando?" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
        
        <div class="flex items-center justify-between pt-2 border-t border-slate-700/50">
          <label class="cursor-pointer flex items-center gap-2 text-xs text-slate-400 hover:text-slate-200">
            📷 <span>Añadir Imagen</span>
            <input type="file" id="imageInput" accept="image/*" class="hidden">
          </label>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition">
            Publicar
          </button>
        </div>
      </form>
    </div>

    <!-- SECCIÓN DE INICIO / FEED -->
    <div>
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">INICIO / FEED Y NOTICIAS</h2>
      <div id="feedContainer" class="space-y-4">
        <!-- Aquí se renderizan los posts -->
      </div>
    </div>

  </div>

  <script>
    // Inicialización de Supabase
    // const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
    // const SUPABASE_KEY = 'tu-anon-key';
    // const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) currentUser = user;

      await loadStories();
      await loadFeed();
      subscribeRealtime();

      const postForm = document.getElementById('postForm');
      if (postForm) {
        postForm.addEventListener('submit', handlePostSubmit);
      }
    });

    // CARGAR HISTORIAS
    async function loadStories() {
      const container = document.getElementById('storiesContainer');
      if (!container) return;

      const { data: stories } = await supabase
        .from('stories')
        .select('*, profiles(username, avatar_url)')
        .gte('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false });

      let html = `
        <div class="flex-shrink-0 text-center cursor-pointer" onclick="document.getElementById('storyFileInput').click()">
          <div class="w-14 h-14 rounded-full bg-slate-800 border-2 border-dashed border-slate-600 flex items-center justify-center text-xl hover:border-blue-500 transition">
            ➕
          </div>
          <span class="text-xs text-slate-400 mt-1 block">Tu estado</span>
          <input type="file" id="storyFileInput" accept="image/*,video/*" class="hidden" onchange="uploadStory(this.files[0])">
        </div>
      `;

      if (stories) {
        stories.forEach(story => {
          html += `
            <div class="flex-shrink-0 text-center cursor-pointer">
              <div class="w-14 h-14 rounded-full p-[2px] bg-gradient-to-tr from-yellow-500 via-rose-500 to-purple-600">
                <img src="${story.profiles?.avatar_url || 'https://via.placeholder.com/150'}" class="w-full h-full rounded-full object-cover border-2 border-slate-900">
              </div>
              <span class="text-xs text-slate-400 mt-1 block max-w-[60px] truncate">
                ${story.profiles?.username || 'Usuario'}
              </span>
            </div>
          `;
        });
      }
      container.innerHTML = html;
    }

    // SUBIR HISTORIA
    async function uploadStory(file) {
      if (!file || !currentUser) return alert('Inicia sesión para subir un estado');
      const filePath = `${currentUser.id}/${Date.now()}.${file.name.split('.').pop()}`;

      const { error } = await supabase.storage.from('stories').upload(filePath, file);
      if (error) return alert('Error al subir historia');

      const { data } = supabase.storage.from('stories').getPublicUrl(filePath);
      await supabase.from('stories').insert([{
        user_id: currentUser.id,
        media_url: data.publicUrl,
        type: file.type.includes('video') ? 'video' : 'image'
      }]);

      loadStories();
    }

    // CARGAR FEED
    async function loadFeed() {
      const container = document.getElementById('feedContainer');
      if (!container) return;

      const { data: posts } = await supabase
        .from('posts')
        .select('*, profiles(username, avatar_url, handle), post_likes(user_id), post_comments(*)')
        .order('created_at', { ascending: false });

      if (!posts) return;

      container.innerHTML = posts.map(post => {
        const isLiked = currentUser ? post.post_likes?.some(like => like.user_id === currentUser.id) : false;
        const likesCount = post.post_likes?.length || 0;
        const username = post.profiles?.username || 'Usuario';
        const handle = post.profiles?.handle || 'usuario';

        return `
          <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/60 shadow-md">
            <div class="flex items-center gap-3 mb-3">
              <img src="${post.profiles?.avatar_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover border border-slate-700">
              <div>
                <div class="flex items-center gap-2">
                  <h4 class="text-sm font-semibold text-slate-100">${username}</h4>
                  ${post.is_news ? '<span class="text-[10px] bg-blue-600 text-white font-bold px-1.5 py-0.5 rounded">📰 NOTICIA</span>' : ''}
                </div>
                <span class="text-xs text-slate-500">@${handle}</span>
              </div>
            </div>

            ${post.content ? `<p class="text-sm text-slate-200 mb-3 whitespace-pre-line">${post.content}</p>` : ''}
            ${post.image_url ? `<img src="${post.image_url}" class="w-full rounded-lg mb-3 border border-slate-700 max-h-96 object-cover">` : ''}

            <div class="flex items-center gap-4 pt-2 border-t border-slate-700/50">
              <button onclick="toggleLike('${post.id}', ${isLiked})" class="flex items-center gap-1.5 text-xs font-semibold ${isLiked ? 'text-red-500' : 'text-slate-400 hover:text-slate-200'}">
                <span>${isLiked ? '❤️' : '🤍'}</span>
                <span>${likesCount}</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // CREAR POST
    async function handlePostSubmit(e) {
      e.preventDefault();
      if (!currentUser) return alert('Debes iniciar sesión para publicar');

      const input = document.getElementById('postInput');
      const fileInput = document.getElementById('imageInput');
      const content = input.value.trim();
      const file = fileInput.files[0];

      if (!content && !file) return;

      let imageUrl = null;
      if (file) {
        const filePath = `${currentUser.id}/${Date.now()}.${file.name.split('.').pop()}`;
        await supabase.storage.from('posts').upload(filePath, file);
        const { data } = supabase.storage.from('posts').getPublicUrl(filePath);
        imageUrl = data.publicUrl;
      }

      await supabase.from('posts').insert([{
        user_id: currentUser.id,
        content: content || null,
        image_url: imageUrl
      }]);

      input.value = '';
      fileInput.value = '';
      loadFeed();
    }

    // REACCIONES (ME GUSTA)
    async function toggleLike(postId, isLiked) {
      if (!currentUser) return;
      if (isLiked) {
        await supabase.from('post_likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
      } else {
        await supabase.from('post_likes').insert([{ post_id: postId, user_id: currentUser.id }]);
      }
      loadFeed();
    }

    // REALTIME
    function subscribeRealtime() {
      supabase
        .channel('public:realtime_feed')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadFeed())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'stories' }, () => loadStories())
        .subscribe();
    }
  </script>
</body>
</html>
