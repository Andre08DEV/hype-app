<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hype App - Chat & Amigos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white font-sans flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center z-10">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-extrabold text-cyan-400 tracking-wider">⚡ HYPE</h1>
      <nav id="app-nav" class="hidden flex gap-1 bg-slate-800/60 p-1 rounded-xl border border-slate-700/50">
        <button id="nav-chat-btn" class="px-3 py-1 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950 transition-all">Chat Global</button>
        <button id="nav-friends-btn" class="px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
          Amigos
          <span id="friends-badge" class="hidden bg-cyan-500 text-slate-950 text-[10px] font-black px-1.5 py-0.2 rounded-full">0</span>
        </button>
      </nav>
    </div>

    <div id="user-bar" class="hidden flex items-center gap-3">
      <button id="open-profile-btn" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl border border-slate-700 transition-all">
        <img id="nav-avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="w-6 h-6 rounded-full object-cover" alt="Avatar">
        <span id="user-display" class="text-xs font-medium text-slate-200"></span>
      </button>
      <button id="logout-btn" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-1.5 rounded-xl font-bold transition-all">Salir</button>
    </div>
  </header>

  <!-- PANTALLA 1: LOGIN -->
  <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm space-y-4 text-center">
      <h2 class="text-xl font-bold text-white">Entrar a Hype</h2>
      <p class="text-xs text-slate-400">Ingresa a tu cuenta para chatear y conectar</p>

      <button id="google-login-btn" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 transition-all">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1H12v3.7h5.35c-.23 1.22-1.33 3.5-5.35 3.5c-3.22 0-5.85-2.67-5.85-5.95s2.63-5.95 5.85-5.95c1.83 0 3.06.78 3.76 1.45l2.9-2.82C18.8 3.38 15.7 2 12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c5.77 0 9.6-4.06 9.6-9.77c0-.66-.07-1.13-.25-1.13z"/></svg>
        Continuar con Google
      </button>

      <div class="flex items-center gap-2 my-2">
        <div class="flex-1 h-px bg-slate-800"></div>
        <span class="text-[10px] text-slate-500 uppercase">o con correo</span>
        <div class="flex-1 h-px bg-slate-800"></div>
      </div>

      <form id="email-auth-form" class="space-y-3 text-left">
        <div>
          <label class="text-[10px] text-slate-400 uppercase font-bold">Correo</label>
          <input id="auth-email" type="email" required placeholder="tu@correo.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 mt-1">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 uppercase font-bold">Contraseña</label>
          <input id="auth-password" type="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 mt-1">
        </div>
        <div class="flex gap-2 pt-2">
          <button id="login-btn" type="submit" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2 rounded-xl text-sm transition-all">Ingresar</button>
          <button id="signup-btn" type="button" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-sm border border-slate-700 transition-all">Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PANTALLA 2: CHAT GLOBAL -->
  <div id="chat-screen" class="hidden flex-1 flex flex-col bg-slate-950 overflow-hidden">
    <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3">
      <div class="text-slate-500 text-center text-xs my-4">Cargando mensajes...</div>
    </div>

    <form id="chat-form" class="p-4 bg-slate-900 border-t border-slate-800 flex gap-2">
      <input id="message-input" type="text" placeholder="Escribe en el chat global..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-cyan-500 text-white" required />
      <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-2 rounded-xl text-sm transition-all">Enviar</button>
    </form>
  </div>

  <!-- PANTALLA 3: SECCIÓN DE AMIGOS & CHAT PRIVADO -->
  <div id="friends-screen" class="hidden flex-1 flex flex-col md:flex-row overflow-hidden">
    <!-- Panel Izquierdo: Lista de Amigos -->
    <div id="friends-sidebar" class="w-full md:w-80 bg-slate-900/50 border-r border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto">
      <!-- Agregar Amigo -->
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide">Añadir Amigo</h3>
        <form id="add-friend-form" class="flex gap-2">
          <div class="relative flex-1">
            <span class="absolute left-2.5 top-2 text-slate-500 text-xs">@</span>
            <input id="add-friend-handle" type="text" placeholder="handle" required class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-6 pr-2 py-1.5 text-xs focus:outline-none focus:border-cyan-500">
          </div>
          <button type="submit" class="bg-cyan-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs">Añadir</button>
        </form>
      </div>

      <!-- Solicitudes Pendientes -->
      <div id="requests-section" class="hidden space-y-2">
        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Solicitudes Pendientes</h3>
        <div id="requests-list" class="space-y-2"></div>
      </div>

      <!-- Lista de Amigos -->
      <div class="flex-1 space-y-2">
        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Mis Amigos (<span id="friends-count">0</span>)</h3>
        <div id="friends-list" class="space-y-1.5"></div>
      </div>
    </div>

    <!-- Panel Derecho: Chat Privado con Amigo -->
    <div id="private-chat-area" class="flex-1 flex flex-col bg-slate-950">
      <div id="no-friend-selected" class="flex-1 flex flex-col items-center justify-center p-6 text-center text-slate-500">
        <p class="text-3xl mb-2">💬</p>
        <p class="text-sm font-semibold">Selecciona un amigo para chatear</p>
      </div>

      <div id="active-dm-container" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <!-- DM Header -->
        <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img id="dm-friend-avatar" src="" class="w-8 h-8 rounded-full object-cover">
            <div>
              <p id="dm-friend-name" class="text-xs font-bold text-white"></p>
              <p id="dm-friend-handle" class="text-[10px] text-slate-400"></p>
            </div>
          </div>
        </div>

        <!-- DM Messages -->
        <div id="dm-messages-container" class="flex-1 p-4 overflow-y-auto space-y-3"></div>

        <!-- Popups de Emojis / GIFs -->
        <div id="emoji-picker-popup" class="hidden p-2 bg-slate-900 border border-slate-800 rounded-xl grid grid-cols-6 gap-2 text-xl max-h-40 overflow-y-auto mx-4 mb-2">
          <button class="emoji-btn">😀</button><button class="emoji-btn">😂</button><button class="emoji-btn">🔥</button><button class="emoji-btn">❤️</button><button class="emoji-btn">👍</button><button class="emoji-btn">😎</button>
          <button class="emoji-btn">🎉</button><button class="emoji-btn">👀</button><button class="emoji-btn">💯</button><button class="emoji-btn">⚡</button><button class="emoji-btn">🙌</button><button class="emoji-btn">😭</button>
        </div>

        <div id="gif-picker-popup" class="hidden p-3 bg-slate-900 border border-slate-800 rounded-xl mx-4 mb-2 space-y-2">
          <input id="gif-search-input" type="text" placeholder="Buscar GIF..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white">
          <div id="gif-results" class="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto"></div>
        </div>

        <!-- DM Form / Input -->
        <div class="p-3 bg-slate-900 border-t border-slate-800 relative">
          <!-- Grabación de Voz Indicator -->
          <div id="recording-bar" class="hidden flex items-center justify-between bg-red-950/60 border border-red-500/40 p-2 rounded-xl mb-2 text-xs">
            <div class="flex items-center gap-2 text-red-400">
              <span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
              <span>Grabando audio... <strong id="recording-timer">0:00</strong></span>
            </div>
            <div class="flex gap-2">
              <button id="cancel-record-btn" class="text-slate-400 hover:text-white font-bold px-2">Cancelar</button>
              <button id="stop-record-btn" class="bg-red-500 text-white font-bold px-3 py-1 rounded-lg">Enviar Audio</button>
            </div>
          </div>

          <form id="dm-form" class="flex items-center gap-2">
            <button type="button" id="emoji-toggle-btn" class="p-2 text-slate-400 hover:text-white text-lg">😀</button>
            <button type="button" id="gif-toggle-btn" class="p-2 text-slate-400 hover:text-white font-bold text-xs bg-slate-800 rounded-lg">GIF</button>
            
            <label class="p-2 text-slate-400 hover:text-white cursor-pointer">
              📷
              <input id="dm-file-input" type="file" accept="image/*" class="hidden">
            </label>

            <button type="button" id="record-audio-btn" class="p-2 text-slate-400 hover:text-red-400 text-lg">🎙️</button>

            <input id="dm-input" type="text" placeholder="Escribe un mensaje privado..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-cyan-500 text-white">
            
            <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: PERFIL -->
  <div id="profile-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-lg font-bold text-white">Editar Perfil</h3>
        <button id="close-profile-btn" class="text-slate-400 hover:text-white font-bold text-lg">&times;</button>
      </div>

      <form id="profile-form" class="space-y-3">
        <div class="flex items-center gap-4">
          <img id="profile-preview-avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="w-16 h-16 rounded-full object-cover border-2 border-cyan-500 flex-shrink-0">
          <div class="flex-1">
            <label class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Foto de Perfil</label>
            <input id="profile-file-input" type="file" accept="image/*" class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-cyan-400 hover:file:bg-slate-700 cursor-pointer">
          </div>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 uppercase font-bold">Nombre Visible</label>
          <input id="profile-username" type="text" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 mt-1">
        </div>

        <div>
          <label class="text-[10px] text-slate-400 uppercase font-bold">Usuario (@arroba)</label>
          <div class="relative mt-1">
            <span class="absolute left-3 top-2 text-slate-500 text-sm">@</span>
            <input id="profile-handle" type="text" required class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-7 pr-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 uppercase font-bold">Descripción / Biografía</label>
          <textarea id="profile-bio" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 mt-1 resize-none"></textarea>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" id="cancel-profile-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-sm border border-slate-700">Cancelar</button>
          <button type="submit" id="save-profile-btn" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2 rounded-xl text-sm transition-all">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vqxfczrtjgwpszdvksuy.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGZjenJ0amd3cHN6ZHZrc3V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MjgxNDYsImV4cCI6MjEwMzEwNDE0Nn0.CwfcwVVxq0rkvM6A_7j5wJDEP9HH8weIimsJGpC6iuk";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentProfile = null;
    let selectedFile = null;

    let activeFriend = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingTimerInterval = null;
    let recordingSeconds = 0;

    // DOM Elements
    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const friendsScreen = document.getElementById('friends-screen');
    const userBar = document.getElementById('user-bar');
    const appNav = document.getElementById('app-nav');
    const userDisplay = document.getElementById('user-display');
    const navAvatar = document.getElementById('nav-avatar');
    const logoutBtn = document.getElementById('logout-btn');

    const navChatBtn = document.getElementById('nav-chat-btn');
    const navFriendsBtn = document.getElementById('nav-friends-btn');
    const friendsBadge = document.getElementById('friends-badge');

    const profileModal = document.getElementById('profile-modal');
    const openProfileBtn = document.getElementById('open-profile-btn');
    const closeProfileBtn = document.getElementById('close-profile-btn');
    const cancelProfileBtn = document.getElementById('cancel-profile-btn');
    const profileForm = document.getElementById('profile-form');
    const saveProfileBtn = document.getElementById('save-profile-btn');

    const profileFileInput = document.getElementById('profile-file-input');
    const profilePreviewAvatar = document.getElementById('profile-preview-avatar');
    const profileUsernameInput = document.getElementById('profile-username');
    const profileHandleInput = document.getElementById('profile-handle');
    const profileBioInput = document.getElementById('profile-bio');

    const messagesContainer = document.getElementById('messages-container');

    // DM Elements
    const noFriendSelected = document.getElementById('no-friend-selected');
    const activeDmContainer = document.getElementById('active-dm-container');
    const dmFriendAvatar = document.getElementById('dm-friend-avatar');
    const dmFriendName = document.getElementById('dm-friend-name');
    const dmFriendHandle = document.getElementById('dm-friend-handle');
    const dmMessagesContainer = document.getElementById('dm-messages-container');
    const dmInput = document.getElementById('dm-input');
    const dmFileInput = document.getElementById('dm-file-input');

    const emojiPickerPopup = document.getElementById('emoji-picker-popup');
    const gifPickerPopup = document.getElementById('gif-picker-popup');
    const recordingBar = document.getElementById('recording-bar');
    const recordingTimer = document.getElementById('recording-timer');

    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        await loadProfile();
        showChatTab();
        loadFriendsData();
      } else {
        showAuthScreen();
      }
    }

    async function loadProfile() {
      if (!currentUser) return;

      let { data } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (!data) {
        const defaultUsername = currentUser.email.split('@')[0];
        const defaultHandle = defaultUsername.toLowerCase().replace(/[^a-z0-9]/g, '');
        const defaultAvatar = 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
        
        const { data: newProfile } = await supabaseClient
          .from('profiles')
          .insert([{
            id: currentUser.id,
            email: currentUser.email,
            username: defaultUsername,
            handle: defaultHandle,
            avatar_url: defaultAvatar,
            bio: '¡Hola! Estoy usando Hype.'
          }])
          .select()
          .single();
          
        data = newProfile;
      }

      currentProfile = data;

      if (currentProfile) {
        userDisplay.textContent = currentProfile.username || currentUser.email;
        navAvatar.src = currentProfile.avatar_url || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
      }
    }

    function showAuthScreen() {
      authScreen.classList.remove('hidden');
      chatScreen.classList.add('hidden');
      friendsScreen.classList.add('hidden');
      userBar.classList.add('hidden');
      appNav.classList.add('hidden');
    }

    function showChatTab() {
      authScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      friendsScreen.classList.add('hidden');
      userBar.classList.remove('hidden');
      appNav.classList.remove('hidden');

      navChatBtn.className = "px-3 py-1 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950 transition-all";
      navFriendsBtn.className = "px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1.5";
      loadMessages();
    }

    function showFriendsTab() {
      authScreen.classList.add('hidden');
      chatScreen.classList.add('hidden');
      friendsScreen.classList.remove('hidden');

      navFriendsBtn.className = "px-3 py-1 text-xs font-bold rounded-lg bg-cyan-500 text-slate-950 transition-all flex items-center gap-1.5";
      navChatBtn.className = "px-3 py-1 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all";
      loadFriendsData();
    }

    navChatBtn.addEventListener('click', showChatTab);
    navFriendsBtn.addEventListener('click', showFriendsTab);

    // MODAL PERFIL
    openProfileBtn.addEventListener('click', () => {
      if (!currentProfile) return;
      selectedFile = null;
      profileFileInput.value = '';
      profilePreviewAvatar.src = currentProfile.avatar_url || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
      profileUsernameInput.value = currentProfile.username || '';
      profileHandleInput.value = currentProfile.handle || '';
      profileBioInput.value = currentProfile.bio || '';
      profileModal.classList.remove('hidden');
    });

    closeProfileBtn.addEventListener('click', () => profileModal.classList.add('hidden'));
    cancelProfileBtn.addEventListener('click', () => profileModal.classList.add('hidden'));

    profileFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        selectedFile = file;
        profilePreviewAvatar.src = URL.createObjectURL(file);
      }
    });

    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      saveProfileBtn.disabled = true;
      saveProfileBtn.textContent = 'Guardando...';

      let avatarUrl = currentProfile?.avatar_url || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';

      if (selectedFile) {
        const fileExt = selectedFile.name.split('.').pop();
        const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;

        const { error: uploadError } = await supabaseClient
          .storage
          .from('avatars')
          .upload(fileName, selectedFile, { upsert: true });

        if (!uploadError) {
          const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
          avatarUrl = publicUrlData.publicUrl;
        }
      }

      const username = profileUsernameInput.value.trim();
      const handle = profileHandleInput.value.trim().toLowerCase().replace(/\s+/g, '');
      const bio = profileBioInput.value.trim();

      const { error } = await supabaseClient
        .from('profiles')
        .upsert({
          id: currentUser.id,
          email: currentUser.email,
          avatar_url: avatarUrl,
          username,
          handle,
          bio,
          updated_at: new Date()
        });

      saveProfileBtn.disabled = false;
      saveProfileBtn.textContent = 'Guardar Cambios';

      if (error) alert("Error al actualizar: " + error.message);
      else {
        await loadProfile();
        profileModal.classList.add('hidden');
        loadMessages();
      }
    });

    // SISTEMA DE AMIGOS
    document.getElementById('add-friend-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('add-friend-handle');
      const handleTarget = input.value.trim().toLowerCase().replace('@', '');

      if (!handleTarget) return;

      if (handleTarget === currentProfile.handle) {
        return alert("No puedes enviarte una solicitud a ti mismo.");
      }

      const { data: targetProfile, error: searchError } = await supabaseClient
        .from('profiles')
        .select('id')
        .eq('handle', handleTarget)
        .single();

      if (searchError || !targetProfile) {
        return alert("Usuario no encontrado. Revisa el handle.");
      }

      const { error: friendError } = await supabaseClient
        .from('friendships')
        .insert([{
          requester_id: currentUser.id,
          receiver_id: targetProfile.id,
          status: 'pending'
        }]);

      if (friendError) {
        if (friendError.code === '23505') alert("Ya existe una solicitud o son amigos.");
        else alert("Error: " + friendError.message);
      } else {
        alert(`¡Solicitud enviada a @${handleTarget}!`);
        input.value = '';
      }
    });

    async function loadFriendsData() {
      if (!currentUser) return;

      const { data: requests } = await supabaseClient
        .from('friendships')
        .select(`
          id,
          requester_id,
          profiles:requester_id (id, username, handle, avatar_url)
        `)
        .eq('receiver_id', currentUser.id)
        .eq('status', 'pending');

      const requestsSection = document.getElementById('requests-section');
      const requestsList = document.getElementById('requests-list');

      if (requests && requests.length > 0) {
        requestsSection.classList.remove('hidden');
        friendsBadge.textContent = requests.length;
        friendsBadge.classList.remove('hidden');

        requestsList.innerHTML = requests.map(r => `
          <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-2 rounded-xl">
            <div class="flex items-center gap-2">
              <img src="${r.profiles.avatar_url || 'https://cdn-icons-png.flaticon.com/512/847/847969.png'}" class="w-7 h-7 rounded-full object-cover">
              <div>
                <p class="text-xs font-bold text-white">${r.profiles.username}</p>
                <p class="text-[9px] text-slate-500">@${r.profiles.handle}</p>
              </div>
            </div>
            <div class="flex gap-1">
              <button onclick="respondFriendRequest('${r.id}', 'accepted')" class="bg-cyan-500 text-slate-950 font-bold px-2 py-0.5 rounded-md text-[10px]">✓</button>
              <button onclick="respondFriendRequest('${r.id}', 'rejected')" class="bg-slate-800 text-slate-400 font-bold px-2 py-0.5 rounded-md text-[10px]">✕</button>
            </div>
          </div>
        `).join('');
      } else {
        requestsSection.classList.add('hidden');
        friendsBadge.classList.add('hidden');
      }

      const { data: friendships } = await supabaseClient
        .from('friendships')
        .select(`id, requester_id, receiver_id`)
        .or(`requester_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
        .eq('status', 'accepted');

      const friendsList = document.getElementById('friends-list');
      const friendsCount = document.getElementById('friends-count');

      if (friendships && friendships.length > 0) {
        const friendUserIds = friendships.map(f => f.requester_id === currentUser.id ? f.receiver_id : f.requester_id);

        const { data: friendsProfiles } = await supabaseClient
          .from('profiles')
          .select('*')
          .in('id', friendUserIds);

        friendsCount.textContent = friendsProfiles ? friendsProfiles.length : 0;

        friendsList.innerHTML = (friendsProfiles || []).map(f => `
          <div onclick="openPrivateChat('${f.id}', '${f.username}', '${f.handle}', '${f.avatar_url || ''}')" class="flex items-center gap-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 p-2.5 rounded-xl cursor-pointer transition-all">
            <img src="${f.avatar_url || 'https://cdn-icons-png.flaticon.com/512/847/847969.png'}" class="w-8 h-8 rounded-full object-cover">
            <div class="flex-1 overflow-hidden">
              <p class="text-xs font-bold text-cyan-400 truncate">${f.username}</p>
              <p class="text-[10px] text-slate-500 truncate">@${f.handle}</p>
            </div>
          </div>
        `).join('');
      } else {
        friendsCount.textContent = 0;
        friendsList.innerHTML = '<div class="text-slate-500 text-xs py-4 text-center">Sin amigos aún.</div>';
      }
    }

    async function respondFriendRequest(requestId, status) {
      await supabaseClient.from('friendships').update({ status }).eq('id', requestId);
      loadFriendsData();
    }

    // CHAT PRIVADO CON AMIGO
    function openPrivateChat(friendId, name, handle, avatarUrl) {
      activeFriend = { id: friendId, name, handle, avatarUrl };
      noFriendSelected.classList.add('hidden');
      activeDmContainer.classList.remove('hidden');

      dmFriendAvatar.src = avatarUrl || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
      dmFriendName.textContent = name;
      dmFriendHandle.textContent = `@${handle}`;

      loadDirectMessages();
    }

    async function loadDirectMessages() {
      if (!activeFriend || !currentUser) return;

      const { data, error } = await supabaseClient
        .from('direct_messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeFriend.id}),and(sender_id.eq.${activeFriend.id},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      if (error) return;

      dmMessagesContainer.innerHTML = '';
      (data || []).forEach(renderDirectMessage);
    }

    function renderDirectMessage(msg) {
      const isMe = msg.sender_id === currentUser.id;
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

      let contentHtml = '';
      if (msg.type === 'image' || msg.type === 'gif') {
        contentHtml = `<img src="${msg.media_url}" class="max-w-xs rounded-xl border border-slate-700 my-1 object-cover">`;
      } else if (msg.type === 'audio') {
        contentHtml = `<audio controls src="${msg.media_url}" class="my-1 h-8 max-w-xs"></audio>`;
      } else {
        contentHtml = `<p class="text-xs break-words">${msg.content}</p>`;
      }

      msgDiv.innerHTML = `
        <div class="max-w-[75%] p-3 rounded-2xl ${isMe ? 'bg-cyan-600 text-slate-950 rounded-br-none' : 'bg-slate-900 text-white border border-slate-800 rounded-bl-none'} space-y-1">
          ${contentHtml}
          <span class="text-[9px] opacity-70 block text-right">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>
      `;

      dmMessagesContainer.appendChild(msgDiv);
      dmMessagesContainer.scrollTop = dmMessagesContainer.scrollHeight;
    }

    // ENVIAR MENSAJE DE TEXTO PRIVADO
    document.getElementById('dm-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = dmInput.value.trim();
      if (!content || !activeFriend) return;

      const { error } = await supabaseClient.from('direct_messages').insert([{
        sender_id: currentUser.id,
        receiver_id: activeFriend.id,
        content,
        type: 'text'
      }]);

      if (!error) dmInput.value = '';
    });

    // FOTOS EN CHAT PRIVADO
    dmFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !activeFriend) return;

      const fileExt = file.name.split('.').pop();
      const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;

      const { error: uploadError } = await supabaseClient.storage.from('chat-media').upload(fileName, file);

      if (!uploadError) {
        const { data } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
        await supabaseClient.from('direct_messages').insert([{
          sender_id: currentUser.id,
          receiver_id: activeFriend.id,
          media_url: data.publicUrl,
          type: 'image'
        }]);
      }
    });

    // NOTAS DE VOZ
    const recordAudioBtn = document.getElementById('record-audio-btn');
    const cancelRecordBtn = document.getElementById('cancel-record-btn');
    const stopRecordBtn = document.getElementById('stop-record-btn');

    recordAudioBtn.addEventListener('click', async () => {
      if (!navigator.mediaDevices) return alert("Tu navegador no soporta grabación de voz.");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.start();

        recordingSeconds = 0;
        recordingBar.classList.remove('hidden');
        recordingTimerInterval = setInterval(() => {
          recordingSeconds++;
          const mins = Math.floor(recordingSeconds / 60);
          const secs = recordingSeconds % 60;
          recordingTimer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }, 1000);
      } catch (err) {
        alert("Permiso de micrófono denegado o no disponible.");
      }
    });

    cancelRecordBtn.addEventListener('click', () => {
      if (mediaRecorder) mediaRecorder.stop();
      clearInterval(recordingTimerInterval);
      recordingBar.classList.add('hidden');
    });

    stopRecordBtn.addEventListener('click', () => {
      if (!mediaRecorder) return;
      
      mediaRecorder.onstop = async () => {
        clearInterval(recordingTimerInterval);
        recordingBar.classList.add('hidden');

        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const fileName = `${currentUser.id}-${Date.now()}.webm`;

        const { error: uploadError } = await supabaseClient.storage.from('chat-audio').upload(fileName, audioBlob);

        if (!uploadError) {
          const { data } = supabaseClient.storage.from('chat-audio').getPublicUrl(fileName);
          await supabaseClient.from('direct_messages').insert([{
            sender_id: currentUser.id,
            receiver_id: activeFriend.id,
            media_url: data.publicUrl,
            type: 'audio'
          }]);
        }
      };

      mediaRecorder.stop();
    });

    // EMOJIS & GIFS
    document.getElementById('emoji-toggle-btn').addEventListener('click', () => {
      emojiPickerPopup.classList.toggle('hidden');
      gifPickerPopup.classList.add('hidden');
    });

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        dmInput.value += btn.textContent;
        emojiPickerPopup.classList.add('hidden');
      });
    });

    document.getElementById('gif-toggle-btn').addEventListener('click', () => {
      gifPickerPopup.classList.toggle('hidden');
      emojiPickerPopup.classList.add('hidden');
    });

    document.getElementById('gif-search-input').addEventListener('input', async (e) => {
      const query = e.target.value.trim();
      if (!query) return;

      const res = await fetch(`https://g.tenor.com/v1/search?q=${query}&key=LIVDSRZULELA&limit=6`);
      const data = await res.json();
      
      const gifResults = document.getElementById('gif-results');
      gifResults.innerHTML = (data.results || []).map(g => `
        <img src="${g.media[0].gif.url}" onclick="sendGif('${g.media[0].gif.url}')" class="rounded-lg border border-slate-700 cursor-pointer h-16 w-full object-cover">
      `).join('');
    });

    async function sendGif(gifUrl) {
      if (!activeFriend) return;
      await supabaseClient.from('direct_messages').insert([{
        sender_id: currentUser.id,
        receiver_id: activeFriend.id,
        media_url: gifUrl,
        type: 'gif'
      }]);
      gifPickerPopup.classList.add('hidden');
    }

    // REALTIME PARA DM
    supabaseClient
      .channel('public:direct_messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages' }, payload => {
        const msg = payload.new;
        if (activeFriend && (
          (msg.sender_id === currentUser.id && msg.receiver_id === activeFriend.id) ||
          (msg.sender_id === activeFriend.id && msg.receiver_id === currentUser.id)
        )) {
          renderDirectMessage(msg);
        }
      })
      .subscribe();

    // AUTH
    document.getElementById('email-auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert("Error: " + error.message);
      else {
        currentUser = data.user;
        await loadProfile();
        showChatTab();
      }
    });

    document.getElementById('signup-btn').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert("Ingresa correo y contraseña.");

      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) alert("Error: " + error.message);
      else alert("¡Registro exitoso! Ya puedes ingresar.");
    });

    document.getElementById('google-login-btn').addEventListener('click', async () => {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
      if (error) alert("Error con Google: " + error.message);
    });

    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      currentUser = null;
      currentProfile = null;
      showAuthScreen();
    });

    // CHAT GLOBAL
    function renderMessage(msg) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex gap-3 items-start bg-slate-900 p-3 rounded-xl border border-slate-800';
      
      const avatarSrc = msg.avatar_url || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
      const handleDisplay = msg.handle ? `@${msg.handle}` : '';

      msgDiv.innerHTML = `
        <img src="${avatarSrc}" class="w-9 h-9 rounded-full object-cover border border-slate-700 mt-0.5" alt="Avatar">
        <div class="flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-bold text-xs text-cyan-400">${msg.username || 'Usuario'}</span>
            ${handleDisplay ? `<span class="text-[11px] text-slate-500">${handleDisplay}</span>` : ''}
            <span class="text-[10px] text-slate-600 ml-auto">${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
          </div>
          <p class="text-sm text-slate-200 mt-1 break-words">${msg.content}</p>
        </div>
      `;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select(`id, content, created_at, username, user_id`)
        .order('created_at', { ascending: true });

      if (error) return;

      const userIds = [...new Set((data || []).map(m => m.user_id).filter(Boolean))];
      let profilesMap = {};

      if (userIds.length > 0) {
        const { data: profiles } = await supabaseClient
          .from('profiles')
          .select('id, username, handle, avatar_url')
          .in('id', userIds);

        (profiles || []).forEach(p => profilesMap[p.id] = p);
      }

      messagesContainer.innerHTML = '';
      if (data && data.length > 0) {
        data.forEach(msg => {
          const profile = profilesMap[msg.user_id] || {};
          renderMessage({
            ...msg,
            username: profile.username || msg.username,
            handle: profile.handle,
            avatar_url: profile.avatar_url
          });
        });
      } else {
        messagesContainer.innerHTML = '<div class="text-slate-500 text-center text-xs my-4">No hay mensajes. ¡Escribe algo!</div>';
      }
    }

    // SUSCRIPCIONES REALTIME
    supabaseClient
      .channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async payload => {
        if (!currentUser) return;
        const newMsg = payload.new;
        let profile = {};
        if (newMsg.user_id) {
          const { data } = await supabaseClient.from('profiles').select('username, handle, avatar_url').eq('id', newMsg.user_id).single();
          if (data) profile = data;
        }
        renderMessage({
          ...newMsg,
          username: profile.username || newMsg.username,
          handle: profile.handle,
          avatar_url: profile.avatar_url
        });
      })
      .subscribe();

    supabaseClient
      .channel('public:friendships')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => {
        if (currentUser) loadFriendsData();
      })
      .subscribe();

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content || !currentUser) return;

      const displayUsername = currentProfile?.username || currentUser.email.split('@')[0];

      const { error } = await supabaseClient
        .from('messages')
        .insert([{ 
          content, 
          username: displayUsername, 
          user_id: currentUser.id 
        }]);

      if (error) alert("Error al enviar: " + error.message);
      else input.value = '';
    });

    checkUser();
  </script>
</body>
</html>
